name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Use gh-pages as the Pages source
        uses: actions/github-script@v7
        with:
          script: |
            const source = { branch: 'gh-pages', path: '/' }
            const base = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              build_type: 'legacy',
              source,
            }
            try {
              await github.request('GET /repos/{owner}/{repo}/pages', {
                owner: context.repo.owner,
                repo: context.repo.repo,
              })
              await github.request('PUT /repos/{owner}/{repo}/pages', base)
            } catch (error) {
              if (error.status !== 404) throw error
              await github.request('POST /repos/{owner}/{repo}/pages', base)
            }
